name: Brainspec
description: >-
  BrainSpec is a medical software company whose FDA-cleared, cloud-based platform BrainSpec Core
  makes MR spectroscopy (MRS) accessible to clinicians and researchers, turning standard MRI scanners
  into a non-invasive "virtual biopsy" that measures brain-chemistry metabolite concentrations. The
  web application ingests MRS data in DICOM, RDA, TWIX, SDAT and G-file formats across GE, Siemens and
  Philips 3T scanners, applies a linear-combination post-processing model, and interfaces directly with
  hospital PACS to pull companion images and push screenshots and reports back. BrainSpec is backed by
  DCVC and Techstars. As of this enrichment pass BrainSpec publishes no public developer API, OpenAPI
  specification, SDK, or developer portal; integration is delivered as a managed clinical/PACS service.
